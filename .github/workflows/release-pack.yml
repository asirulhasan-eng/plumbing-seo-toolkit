name: Build Release Pack

on:
  push:
    branches:
      - main
    paths:
      - "release-pack/**"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release-pack.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          cd release-pack
          zip -r ../free-plumbing-seo-leak-check-toolkit.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Free Plumbing SEO Leak Check Toolkit v1.0.2
          files: free-plumbing-seo-leak-check-toolkit.zip
          body_path: RELEASE_NOTES.md
